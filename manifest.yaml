  - ChatGPT/GPT, Claude, Kimi, Doubao, WorkBuddy, Tongyi, etc.
security_notes: >-
  纯提示词型方法论，不含任何脚本、可执行代码或网络请求，
  无密钥、无数据外传、无越权系统操作。安全等级 P2（安全）。
