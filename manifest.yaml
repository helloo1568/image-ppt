name: image-ppt
display_name: 图片 PPT
version: 2.0.0
description: >-
  将材料制作成图片版或可编辑 PPTX，或将幻灯片图片重建为原生文字、形状、
  组合、表格、图表与独立图片素材。推荐 GPT Image 2.5。
  Agent 负责识别与生图，本地脚本负责 Scene v1 编译、素材裁剪和对象审查。
author: 风清云影 (helloo1568)
license: MIT
category: content
triggers:
  - 图片PPT
  - 可编辑PPT
  - 图片转PPT
  - PPT元素拆分
  - 读书分享PPT
  - image-ppt
  - doc-to-editable-ppt
requires_api_keys: false
platforms:
  - Codex / ChatGPT with image generation and local file tools
  - Other agents with document reading, vision, image generation and Python
security_notes: >-
  Local scripts do not make network requests or handle API keys.
  Host vision/image services may upload supplied content and require separate credentials.
  Scene assets are confined to the scene directory. Exported PPTX embeds referenced assets.
files:
  - SKILL.md
  - README.md
  - README.en.md
  - CHANGELOG.md
  - LICENSE
  - requirements.txt
  - agents/openai.yaml
  - references/prompts.md
  - references/deck-spec-template.md
  - references/models.md
  - references/reconstruction.md
  - references/scene-format.md
  - references/scene.schema.json
  - references/research.md
  - scripts/scene.py
  - scripts/build_editable_ppt.py
  - scripts/audit_editability.py
  - scripts/extract_assets.py
  - scripts/build_image_ppt.py
  - scripts/overlay_text.py
  - examples/editable-scene.example.json
  - examples/editable-demo.pptx
  - examples/editable-preview-02.png
  - examples/silver-emotion-p1.jpg
  - examples/overlay-spec.example.json
