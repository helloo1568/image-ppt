# 图片PPT (image-ppt) 技能清单 — 通用方法论 / Generic Skill Manifest

name: image-ppt
display_name: image-ppt
version: 1.4.0
description: >-
  将书籍、PDF 或任意文字材料分阶段转化为图片版或可编辑 PPT 的工作流技能（图片PPT）。
  默认流程：需求确认 → 四套幻灯片浏览视图式风格缩略图 → 用户选型 → 图片版PPT生成 → 可选的可编辑PPTX还原。
  仅在用户明确授权时跳过确认或预览阶段。
  强烈推荐运行环境：Codex + GPT-Image 2.0（Codex 编排流程、GPT-Image 2.0 绘制页面）。
  平台无关，也可在任何具备文档读取、图像生成与文件输出能力的 AI 助手中使用。
  A platform-agnostic workflow to turn books/PDFs/text into beautiful, editable PPT decks.
  Strongly recommended: Codex + GPT-Image 2.0.
  适用于课堂汇报、读书分享、组会汇报、项目汇报、比赛路演等场景。
author: 风清云影 (helloo1568)
license: MIT
category: content
triggers:
  - 图片PPT
  - 做PPT
  - 生成PPT
  - 把书做成PPT
  - 读书分享PPT
  - 课堂汇报PPT
  - image-ppt
  - doc-to-editable-ppt
requires_api_keys: false
platforms:
  - Codex (strongly recommended, with GPT-Image 2.0)
  - ChatGPT/GPT, Claude, Kimi, Doubao, WorkBuddy, Tongyi, etc.
security_notes: >-
  附带本地图片合并 PPTX 脚本，仅读取指定目录中的 PNG/JPEG 并写入指定 PPTX，
  不包含网络请求、密钥处理、数据上传或越权系统操作。安全等级 P2（安全）。
files:
  - SKILL.md
  - README.md
  - README.en.md
  - requirements.txt
  - .gitignore
  - references/prompts.md
  - references/deck-spec-template.md
  - scripts/build_image_ppt.py
