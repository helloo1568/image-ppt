name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest tests/ -v
      - name: Validate Page Spec example
        run: python scripts/validate_page_spec.py examples/page-spec.example.json --strict
      - name: Validate installer registration
        run: |
          python install.py --client codex --home "${{ runner.temp }}/skill-home" --skip-deps
          python -c "import os; from pathlib import Path; p = Path(os.environ['RUNNER_TEMP']) / 'skill-home' / '.agents' / 'skills' / 'slidemuse' / 'SKILL.md'; assert p.is_file(), p"
      - name: Validate isolated install and upgrade
        if: matrix.python-version == '3.13'
        run: |
          python install.py --client codex --home "${{ runner.temp }}/skill-home"
          python -c "import os, subprocess; from pathlib import Path; p = Path(os.environ['RUNNER_TEMP']) / 'skill-home' / '.agents' / 'skills' / 'slidemuse'; py = Path((p / '.skill-python').read_text().strip()); assert py.is_file(), py; subprocess.run([str(py), str(p / 'scripts' / 'validate_page_spec.py'), str(p / 'examples' / 'page-spec.example.json'), '--strict'], check=True)"
