    <path d="M345 447H394M388 441L394 447L388 453" stroke="#708BA6" stroke-width="1.5"/>
    <text x="449" y="453" fill="#79E9D1" font-size="16" font-weight="700">02</text><text x="484" y="453" fill="#D3DFEF" font-size="18">Image deck</text>
