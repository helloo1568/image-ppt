    <text x="60" y="186" fill="#F5F8FF" font-size="88" font-weight="700" letter-spacing="-4">Slide<tspan fill="#79E9D1">Muse</tspan></text>
    <text x="65" y="245" fill="#F0F5FF" font-size="29" font-weight="600">From source to slides.</text>
    <text x="65" y="289" fill="#A8BAD1" font-size="29">From pixels to possibilities.</text>
