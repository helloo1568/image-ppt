<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SlideMuse — Visual-first AI Presentation Skill</title>
  <desc id="desc">A midnight-blue banner with a layered presentation illustration. Content, image deck, and editable PPTX are the three stages of the workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#101B32"/><stop offset=".55" stop-color="#0A1326"/><stop offset="1" stop-color="#133B4A"/></linearGradient>
    <linearGradient id="accent" x1="760" y1="160" x2="1120" y2="380" gradientUnits="userSpaceOnUse"><stop stop-color="#74F0D2"/><stop offset="1" stop-color="#62A9F9"/></linearGradient>
    <linearGradient id="card" x1="790" y1="110" x2="1140" y2="380" gradientUnits="userSpaceOnUse"><stop stop-color="#263F57"/><stop offset="1" stop-color="#14243C"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#9DDAD8" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="24" fill="url(#grid)"/>
  <circle cx="1090" cy="245" r="212" stroke="#69D7CF" stroke-opacity=".09"/>
  <circle cx="1090" cy="245" r="260" stroke="#69D7CF" stroke-opacity=".05"/>
